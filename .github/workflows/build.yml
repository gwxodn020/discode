name: Build desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            platform: mac
            native: true
          - name: macOS Intel
            runner: macos-15-intel
            arch: x64
            platform: mac
            native: true
          - name: Windows x64
            runner: windows-2025
            arch: x64
            platform: win
            native: true
          - name: Windows ARM64
            runner: windows-2025
            arch: arm64
            platform: win
            native: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test terminal send, channel selection, and drafts
        if: matrix.native
        run: node test/flow.cjs
      - name: Build native installers
        if: github.event_name != 'pull_request'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged application
        if: github.event_name != 'pull_request' && matrix.native
        run: npm run smoke:packaged
      - name: Generate installer checksums
        if: github.event_name != 'pull_request'
        run: npm run checksums
      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Discode-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
